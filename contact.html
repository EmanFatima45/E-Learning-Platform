<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLearn - Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS: EduLearn Theme Colors */
        :root {
            --primary-green: #10b981;
            --dark-green: #0f766e;
            --light-bg: #f0fdf4;
            --text-color: #064e3b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-container {
            background: white;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-wrap: wrap;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        /* Left Side: Gradient Info Box */
        .contact-info {
            flex: 1;
            background: linear-gradient(135deg, var(--dark-green), var(--primary-green));
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-info h2 {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .contact-info p {
            margin-bottom: 15px;
            opacity: 0.9;
        }

        /* Right Side: Form */
        .contact-form-wrapper {
            flex: 1.5;
            padding: 40px;
        }

        .contact-form-wrapper h3 {
            color: var(--text-color);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #4b5563;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .submit-btn {
            background: linear-gradient(to right, var(--dark-green), var(--primary-green));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .success-msg {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .contact-container { flex-direction: column; }
            .contact-info { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <div class="contact-info">
            <h2>Get in Touch</h2>
            <p>Have questions about our courses? We are here to help you unlock your potential.</p>
            <p>📍 EduLearn Campus, Main Road</p>
            <p>📧 support@edulearn.com</p>
            <p>📞 +923446497033</p>
        </div>

        <div class="contact-form-wrapper">
            <div id="successMsg" class="success-msg">Your message has been saved successfully!</div>
            
            <h3>Send us a Message</h3>
            <form id="contactForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="userEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="subject" placeholder="What is this regarding?" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="message" placeholder="Type your message here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        // JavaScript for Form Submission & LocalStorage
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // 1. Collect Data
            const contactData = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value,
                date: new Date().toLocaleString()
            };

            // 2. LocalStorage Logic (Fetch existing or create new array)
            const allMessages = JSON.parse(localStorage.getItem('contactMessages')) || [];
            
            // 3. Add new message to array
            allMessages.push(contactData);

            // 4. Save back to LocalStorage
            localStorage.setItem('contactMessages', JSON.stringify(allMessages));

            // 5. Show Success UI
            const successBox = document.getElementById('successMsg');
            successBox.style.display = 'block';
            
            // 6. Reset Form
            this.reset();

            // Hide success message after 3 seconds
            setTimeout(() => {
                successBox.style.display = 'none';
            }, 3000);
            
            console.log("Data saved to LocalStorage:", contactData);
        });
    </script>

</body>
</html>
