<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback with Update Course</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #43ba79;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 750px;
        margin: 40px auto;
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .field {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        border-radius: 6px;
        border: 1px solid #ccc;
        outline: none;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 2px rgba(0,123,255,0.15);
    }

    .row {
        display: flex;
        gap: 15px;
    }

    .row .field {
        flex: 1;
    }

    .rating {
        display: flex;
        gap: 15px;
    }

    button {
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
    }

    .submit-btn {
        background: #28a745;
        color: white;
        width: 100%;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background: #218838;
    }

    .update-section {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #ddd;
    }

    .update-btn {
        background: #007bff;
        color: white;
        width: 100%;
        margin-top: 8px;
    }

    .update-btn:hover {
        background: #0056b3;
    }

    .note {
        text-align: center;
        font-size: 13px;
        color: #777;
        margin-top: 15px;
    }

    @media (max-width: 600px) {
        .row {
            flex-direction: column;
        }
    }
</style>
</head>
<body>

<div class="container">

    <h1>Feedback Form</h1>
    <p class="subtitle">Your feedback helps us improve our courses</p>

    <!-- FEEDBACK FORM -->
    <form>
        <div class="row">
            <div class="field">
                <label>Your Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="field">
                <label>Your Email</label>
                <input type="email" placeholder="Enter your email">
            </div>
        </div>

        <div class="field">
            <label>Rate this content</label>
            <div class="rating">
                <label><input type="radio" name="rate"> 1</label>
                <label><input type="radio" name="rate"> 2</label>
                <label><input type="radio" name="rate"> 3</label>
                <label><input type="radio" name="rate"> 4</label>
                <label><input type="radio" name="rate"> 5</label>
            </div>
        </div>

        <div class="field">
            <label>Select Course</label>
            <select id="courseSelect">
                <option>English Learning</option>
                <option>Python Programming</option>
                <option>Graphic Designing</option>
                <option>Web Development</option>
            </select>
        </div>

        <div class="field">
            <label>Your Feedback</label>
            <textarea rows="5" placeholder="Write your feedback here..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Feedback</button>
    </form>

    <!-- UPDATE COURSE SECTION -->
    <div class="update-section">
        <h3>Update Courses (Admin)</h3>

        <div class="field">
            <label>New Course Name</label>
            <input type="text" id="newCourse" placeholder="e.g. UI/UX Design">
        </div>

        <button class="update-btn" onclick="addCourse()">Add Course</button>
    </div>

    <p class="note">New course will appear instantly in the dropdown.</p>
</div>

<script>
    function addCourse() {
        const courseInput = document.getElementById("newCourse");
        const courseName = courseInput.value.trim();
        const select = document.getElementById("courseSelect");

        if (courseName === "") {
            alert("Please enter a course name");
            return;
        }

        const option = document.createElement("option");
        option.text = courseName;
        select.add(option);

        courseInput.value = "";
        alert("Course added successfully!");
    }
</script>

</body>
</html>
