<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #49c59ac5; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-box { background: white; padding: 30px; border-radius: 15px; text-align: center; border-bottom: 5px solid #db9131; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .number { font-size: 2.5rem; font-weight: 600; color: #1e293b; margin-top: 10px; }
    </style>
</head>
<body>
    <a href="home.html" style="text-decoration:none; color:#0b3b95; font-weight:600;">← Back to Dashboard</a>
    <h1 style="margin: 30px 0;">Platform Statistics</h1>
    <div class="grid">
        <div class="stat-box">
            <p>Total Registered Students</p>
            <div id="totalStudents" class="number">0</div>
        </div>
        <div class="stat-box">
            <p>Average Quiz Score</p>
            <div class="number">0%</div>
        </div>
        <div class="stat-box">
            <p>Courses Published</p>
            <div class="number">0</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Local storage se real count uthana
            const students = JSON.parse(localStorage.getItem('allStudents')) || [];
            document.getElementById('totalStudents').innerText = students.length;
        };
    </script>
</body>
</html>
