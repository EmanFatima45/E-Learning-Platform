<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Manage Courses</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f3f4f6; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 10px; }
        button { width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .course-list { margin-top: 30px; }
        .item { background: #f9fafb; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; border: 1px solid #e5e7eb; }
        .empty-text { color: #94a3b8; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="home.html" style="text-decoration:none; color:#10b981;">← Back</a>
        <h2 style="margin-top:15px;">Course Management</h2>
        <input type="text" id="courseInp" placeholder="Enter Course Name...">
        <button onclick="addCourse()">Add New Course</button>
        
        <div class="course-list">
            <h3>Active Course List:</h3>
            <div id="list">
                <p id="noCourse" class="empty-text">No courses added yet.</p>
            </div>
        </div>
    </div>

    <script>
        function addCourse() {
            let val = document.getElementById('courseInp').value;
            let list = document.getElementById('list');
            let noCourse = document.getElementById('noCourse');

            if(val.trim() !== "") {
                if(noCourse) noCourse.remove(); // Empty message hatao
                
                list.innerHTML += `<div class="item"><span>${val}</span> <span style="color:#10b981;">● Active</span></div>`;
                document.getElementById('courseInp').value = "";
            }
        }
    </script>
</body>
</html>
