<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Feedback Inbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #037b4de3; padding: 40px; }
        .container { max-width: 800px; margin: auto; }
        .feedback-card { background: rgb(41, 141, 76); padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid #2d185d; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .no-data { text-align: center; color: hsl(144, 24%, 96%); margin-top: 50px; font-style: italic; }
        .back-btn { text-decoration: none; color: #211d69; font-weight: 600; display: block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="home.html" class="back-btn">← Back to Dashboard</a>
        <h2>Student Feedbacks</h2>
        <div id="feedbackList">
            <p class="no-data">No feedbacks received yet.</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Local Storage se feedback array nikalna
            const feedbacks = JSON.parse(localStorage.getItem('allFeedbacks')) || [];
            const list = document.getElementById('feedbackList');

            if(feedbacks.length > 0) {
                list.innerHTML = ""; // Khali message hata den
                feedbacks.forEach(fb => {
                    list.innerHTML += `
                        <div class="feedback-card">
                            <strong>From: ${fb.studentName}</strong>
                            <p style="margin-top:10px;">"${fb.message}"</p>
                            <small style="color:#94a3b8;">Sent on: ${fb.date}</small>
                        </div>
                    `;
                });
            }
        };
    </script>
</body>
</html>
